name: Remove duplicated root blog posts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove only root-level article copies
        shell: bash
        run: |
          set -euo pipefail
          files=(
            alcoolismo-e-doenca-e-a-justica-garante-direitos-424169.html
            aposentadoria-por-idade-como-funciona-hoje-no-inss-328204.html
            arrendamento-rural-vs-parceria-agricola-qual-a-diferenca-157871.html
            atencao-empregadores-e-empregados-amanha-e-o-5o-dia-util-866337.html
            avos-podem-ser-obrigados-a-pagar-pensao-391681.html
            cadastro-ambiental-rural-car-entenda-sua-importancia-468509.html
            caiu-em-golpe-do-pix-o-banco-e-obrigado-a-devolver-o-dinheiro-578618.html
            cartao-de-credito-voce-conhece-todos-os-seus-direitos-464195.html
            colisao-traseira-presuncao-de-culpa-e-excecoes-legais-732069.html
            contrato-de-arrendamento-o-que-voce-precisa-saber-806610.html
            crime-de-fraude-no-pagamento-por-meio-de-servico-987261.html
            defenda-seus-direitos-no-campo-com-seguranca-034599.html
            desvendando-um-mito-o-banco-pode-cancelar-seu-cpf-descubra-a-verdade-513879.html
            diabetes-da-direito-a-aposentadoria-entenda-o-que-diz-a-lei-425469.html
            dirigir-sem-habilitacao-entenda-os-riscos-e-as-consequencias-legais-129959.html
            drones-na-agricultura-beneficios-regulamentacao-e-cuidados-legais-620837.html
            e-obrigatorio-pintar-o-imovel-no-fim-do-aluguel-873053.html
            e-possivel-transformar-uma-multa-em-advertencia-por-escrito-377573.html
            emprestou-seu-carro-e-recebeu-uma-multa-que-nao-cometeu-511235.html
            entenda-a-area-de-reserva-legal-arl-no-brasil-532525.html
            erro-do-banco-voce-pode-ter-direito-a-indenizacao-por-danos-morais-869275.html
            evite-erros-na-declaracao-do-imposto-de-renda-saiba-o-que-observar-para-nao-cair-na-malha-fina-765328.html
            evite-o-endividamento-com-a-prorrogacao-do-financiamento-rural-402644.html
            expanda-sua-propriedade-rural-com-seguranca-juridica-362318.html
            farol-baixo-durante-o-dia-quando-e-obrigatorio-e-quando-da-multa-828037.html
            feliz-dia-das-maes-914190.html
            foi-vitima-de-clonagem-de-cartao-saiba-o-que-fazer-e-como-se-proteger-077258.html
            furto-famelico-e-a-nova-interpretacao-dos-tribunais-003648.html
            garanta-a-regularizacao-segura-da-sua-propriedade-rural-243894.html
            guarda-de-boneca-bebe-reborn-na-justica-entenda-por-que-esse-pedido-nao-tem-validade-legal-164203.html
            icms-o-imposto-que-afeta-o-seu-bolso-e-o-funcionamento-das-empresas-023733.html
            isencao-x-imunidade-fiscal-qual-a-diferenca-na-pratica-080543.html
            licenciamento-ambiental-voce-sabe-o-que-e-441174.html
            maes-e-pais-de-criancas-autistas-que-sao-servidores-publicos-tem-direito-a-reducao-da-jornada-e-sem-corte-no-salario-845105.html
            motorista-profissional-sua-cnh-e-seu-ganha-pao-e-se-voce-nao-acompanha-sua-pontuacao-pode-colocar-tudo-a-perder-626539.html
            multa-por-excesso-de-velocidade-como-agir-048052.html
            nao-recebi-a-notificacao-da-multa-posso-solicitar-o-cancelamento-546862.html
            o-estabelecimento-pode-recusar-dinheiro-em-especie-704156.html
            o-funcionario-pode-ir-quantas-vezes-ao-banheiro-048842.html
            o-que-e-a-lei-seca-entenda-como-funciona-e-por-que-ela-salva-vidas-098042.html
            o-que-e-direito-agrario-597597.html
            o-que-e-georreferenciamento-de-imoveis-rurais-e-qual-sua-importancia-418470.html
            parado-em-uma-blitz-veja-como-agir-para-evitar-transtornos-690529.html
            pensando-em-processar-alguem-entao-voce-precisa-entender-o-que-isso-realmente-significa-407615.html
            voce-sabe-como-funciona-a-cota-de-reserva-ambiental-569830.html
            voce-sabe-como-recorrer-de-uma-suspensao-da-cnh-veja-o-passo-a-passo-383609.html
            voce-sabe-identificar-clausulas-abusivas-em-contratos-bancarios-082841.html
            voce-sabe-o-que-e-elisao-fiscal-558575.html
            voce-sabe-o-que-e-o-estatuto-da-terra-508062.html
            voce-sabe-o-que-e-o-iss-e-como-ele-afeta-o-seu-negocio-128756.html
            voce-sabe-o-que-e-planejamento-previdenciario-e-por-que-ele-e-tao-importante-160855.html
            voce-sabe-o-que-e-usucapiao-rural-219734.html
            voce-sabe-qual-e-o-procedimento-para-regularizacao-de-ocupacoes-em-areas-rurais-671125.html
            voce-sabia-que-a-pensao-por-morte-e-um-direito-dos-dependentes-do-segurado-do-inss-016987.html
            voce-sabia-que-aposentados-por-invalidez-podem-receber-um-adicional-de-25-no-valor-do-beneficio-045514.html
            voce-sabia-que-o-ipva-nao-e-exclusivamente-destinado-a-manutencao-das-estradas-810252.html
          )
          for file in "${files[@]}"; do
            if [[ -f "$file" ]]; then
              git rm -- "$file"
            fi
          done

      - name: Commit and push cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove duplicated blog posts from repository root" || exit 0
          git push origin HEAD:main

      - name: Remove this temporary workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B cleanup origin/main
          git rm -- .github/workflows/remove-root-post-copies.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary cleanup workflow"
          git push origin HEAD:main
