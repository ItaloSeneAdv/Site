name: Keep sitemap current

on:
  push:
    branches: [main]
    paths:
      - 'blog/**'
      - 'areas/**'
      - 'index.html'
      - 'landingpage.html'
      - 'scripts/generate_sitemap.py'
      - '.github/workflows/update-sitemap.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enrich article authorship
        run: python3 scripts/enrich_article_schema.py

      - name: Generate sitemap
        run: python3 scripts/generate_sitemap.py

      - name: Create SEO metadata pull request when changed
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update sitemap from published pages'
          title: 'chore: update article SEO metadata and sitemap'
          body: |
            Automated SEO maintenance generated from the published pages.

            This pull request updates article authorship metadata and regenerates the sitemap without changing the legal content of the articles.
          branch: automation/seo-metadata-sync
          delete-branch: true
          add-paths: |
            blog
            sitemap.xml
